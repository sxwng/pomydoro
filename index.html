<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pomydoro</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="idle">
  <main>
    <h1 id="mode"><img class="mode-img" src="images/ready.png" alt="Ready"></h1>
    <div id="timer">00:00:00</div>
    <div id="end-time">Next segment at 00:00:00</div>
    <p id="progress"></p>

    <div class="controls">
      <button id="start">Start</button>
      <button id="pause" disabled>Pause</button>
      <button id="reset">Reset</button>
    </div>

  </main>

  <button id="settings-open" type="button" aria-label="Settings" title="Settings">&#9881;</button>

  <dialog id="settings">
    <form id="config" method="dialog">
      <h2>Settings</h2>
      <label for="pattern">Study pattern (minutes, study-break-study-…, end with f)</label>
      <input id="pattern" type="text" value="1-1-1-f" spellcheck="false">
      <p id="pattern-locked" hidden>Reset the timer to change the pattern.</p>
      <p id="error" role="alert"></p>
      <div class="dialog-buttons">
        <button id="settings-cancel" type="button">Cancel</button>
        <button id="settings-save" type="submit">Save</button>
      </div>
    </form>
  </dialog>
  <script src="app.js"></script>
</body>
</html>
