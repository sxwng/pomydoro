<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pomydoro</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="idle">
  <main>
    <h1 id="mode">Ready</h1>
    <div id="timer">00:00:00</div>
    <div id="end-time">Next segment at 00:00:00</div>
    <p id="progress"></p>

    <div class="controls">
      <button id="start">Start</button>
      <button id="pause" disabled>Pause</button>
      <button id="reset">Reset</button>
    </div>

    <form id="config">
      <label for="pattern">Study pattern (minutes, study-break-study-…, end with f)</label>
      <input id="pattern" type="text" value="50-10-40-10-30-10-20-10-10-f" spellcheck="false">
      <p id="error" role="alert"></p>
    </form>
  </main>
  <script src="app.js"></script>
</body>
</html>
